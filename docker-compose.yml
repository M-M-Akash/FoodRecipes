version: '3.8'

services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    environment:
      ORACLE_PASSWORD: secret
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  app:
    build: .
    depends_on:
      oracle-db:
        condition: service_healthy
    environment:
      DB_HOST: oracle-db
      DB_PORT: 1521
      DB_SID: XE
      DB_USER: SYSTEM
      DB_PASSWORD: secret


volumes:
  oracle-data:
